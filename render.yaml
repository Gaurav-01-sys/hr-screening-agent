# Render Blueprint for the HR Screening Agent.
#
# Create all three services with New > Blueprint in the Render dashboard.
# VITE_API_URL must be set to the public URL of hr-screening-backend after
# the backend service has been created (for example,
# https://hr-screening-backend.onrender.com).

services:
  - type: web
    name: hr-screening-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OCRFLUX_URL
        sync: false
      - key: OCRFLUX_API_KEY
        sync: false
      - key: OCRFLUX_MODEL
        value: ChatDOC/OCRFlux-3B

  - type: web
    name: hr-screening-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: hr-screening-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OCRFLUX_URL
        sync: false
      - key: OCRFLUX_API_KEY
        sync: false
      - key: OCRFLUX_MODEL
        value: ChatDOC/OCRFlux-3B
